<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./cedia.svg" type="image/svg+xml" />
    <title>Cedia Agents</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color-scheme: light dark;
      }

      #root {
        min-height: 100vh;
      }

      .app-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        pointer-events: none;
      }

      .app-boot-splash__icon {
        width: 112px;
        height: 112px;
        opacity: 0;
        transform: scale(0.96);
        animation:
          app-boot-splash-in 420ms ease-out forwards,
          app-boot-splash-pulse 2.4s ease-in-out 420ms infinite;
      }

      @keyframes app-boot-splash-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes app-boot-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.98);
          opacity: 0.85;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash__icon {
          animation: app-boot-splash-in 200ms ease-out forwards;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" aria-hidden="true">
        <img
          class="app-boot-splash__icon"
          src="./cedia.svg"
          alt=""
          draggable="false"
        />
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
